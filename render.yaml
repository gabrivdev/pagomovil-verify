services:
  - type: web
    name: pagomovil-verify
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_GATEWAY_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
